<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mazad</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

    <!-- Header -->
    <header class="header">

        <div class="logo">
            <h2>MAZAD</h2>
        </div>

        <div class="header-icons">
            <i class="fa-regular fa-bell"></i>
            <i class="fa-regular fa-user"></i>
        </div>

    </header>

    <!-- Search -->
    <section class="search-section">

        <div class="search-box">

            <i class="fas fa-search"></i>

            <input
                type="text"
                placeholder="ابحث عن سيارات، عقارات، إلكترونيات ...">

        </div>

    </section>

    <!-- Categories -->
    <section class="categories">

        <h3>الفئات</h3>

        <div class="category-grid">

            <div class="category-card">🚗<span>Cars</span></div>

            <div class="category-card">🏠<span>Real Estate</span></div>

            <div class="category-card">📱<span>Electronics</span></div>

            <div class="category-card">🐪<span>Animals</span></div>

            <div class="category-card">🛋<span>Furniture</span></div>

            <div class="category-card">💼<span>Jobs</span></div>

        </div>

    </section>

    <!-- Featured Listings -->

    <section class="listings">

        <h3>Featured Listings</h3>

        <div class="listing-card">

            <img
                src="https://picsum.photos/500/300"
                alt="">

            <div class="listing-info">

                <h4>Toyota Land Cruiser 2024</h4>

                <p class="price">SAR 215,000</p>

                <p class="location">
                    <i class="fa-solid fa-location-dot"></i>
                    Riyadh
                </p>

            </div>

        </div>

    </section>

    <!-- Bottom Navigation -->

    <nav class="bottom-nav">

        <a href="#">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>

        <a href="#">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>Search</span>
        </a>

        <a href="#">
            <i class="fa-solid fa-circle-plus"></i>
            <span>Add</span>
        </a>

        <a href="#">
            <i class="fa-solid fa-comments"></i>
            <span>Chat</span>
        </a>

        <a href="#">
            <i class="fa-solid fa-user"></i>
            <span>Profile</span>
        </a>

    </nav>

    <script src="js/script.js"></script>

</body>

</html>
