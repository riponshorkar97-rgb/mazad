<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mazad | Saudi Marketplace</title>

    <meta name="description" content="Mazad - Premium Saudi marketplace for buying and selling">

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">


    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">


    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


</head>


<body>


<!-- Header -->

<header class="mazad-header">


    <button class="icon-btn">
        <i class="fa-solid fa-bars"></i>
    </button>


    <div class="mazad-logo">
        MAZAD
    </div>


    <div class="header-actions">

        <button class="icon-btn">
            <i class="fa-regular fa-bell"></i>
        </button>


        <button class="icon-btn">
            <i class="fa-regular fa-user"></i>
        </button>

    </div>


</header>



<!-- Hero Section -->


<section class="hero-section">


    <div class="hero-content">


        <span class="hero-badge">
            🇸🇦 Saudi Marketplace
        </span>


        <h1>
            Buy & Sell Everything Easily
        </h1>


        <p>
            Cars, Properties, Electronics,
            Services and more.
        </p>



        <!-- Search -->


        <div class="premium-search">


            <i class="fa-solid fa-magnifying-glass"></i>


            <input 
            type="text"
            placeholder="Search products...">


        </div>



        <!-- Location -->


        <div class="location-box">


            <i class="fa-solid fa-location-dot"></i>


            <span>
                Riyadh, Saudi Arabia
            </span>


        </div>



    </div>


</section>
